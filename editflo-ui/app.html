<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EditFlo Prototype</title>
<meta name="viewport" content="width=1440">
<style>
:root{
  --p:#7B2CBF; --p-600:#6A22A8; --l:#C8A2E8; --tint:#F4ECFB; --tint-2:#FAF6FD;
  --bg:#FAF8F4; --surface:#FFFFFF; --sunk:#F4F1EC; --border:#ECE7E0; --border-2:#E2DCD3;
  --ink:#1E1B22; --ink-2:#3B3640; --mut:#76707C; --faint:#A8A2AE;
  --ok:#2F8F5B; --r:10px; --r-sm:7px;
  --sh:0 1px 2px rgba(30,27,34,.04),0 8px 24px -16px rgba(60,30,90,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:244px 1fr;width:1440px;height:1024px;overflow:hidden}
/* ---------- sidebar ---------- */
.side{background:var(--surface);border-right:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand b{font-family:'Inter Display',Inter;font-size:21px;letter-spacing:-.035em;font-weight:700}
.brand b span{color:var(--p)}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500}
.nav svg{color:var(--mut)}
.nav.on{background:var(--tint);color:var(--p)}
.nav.on svg{color:var(--p)}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint)}
.side .grp{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:18px 10px 6px}
.side .foot{margin-top:auto;border:1px dashed var(--border-2);border-radius:var(--r);padding:14px;color:var(--mut);font-size:12.5px;line-height:1.5}
.side .foot b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.top{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 40px;gap:14px;background:rgba(250,248,244,.9)}
.crumb{color:var(--mut);font-size:13.5px;display:flex;gap:8px;align-items:center}
.crumb b{color:var(--ink);font-weight:600}
.proto{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--p);border:1px dashed var(--l);padding:5px 10px;border-radius:999px;background:var(--tint-2)}
.proto i{width:6px;height:6px;border-radius:50%;background:var(--p)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunk);border:1px solid var(--border);display:grid;place-items:center;color:var(--mut)}
.content{padding:30px 40px 20px;overflow:hidden;flex:1}
/* ---------- primitives ---------- */
h1{font-family:'Inter Display',Inter;font-weight:650;letter-spacing:-.035em;margin:0}
h2{font-size:16px;font-weight:620;letter-spacing:-.01em;margin:0}
.muted{color:var(--mut)}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap}
.btn.pri{background:var(--p);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 14px -8px rgba(123,44,191,.7)}
.btn.sec{background:var(--surface);border-color:var(--border-2);color:var(--ink)}
.btn.ghost{color:var(--p);padding:0;height:auto;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:550;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.p{background:var(--tint);color:var(--p)}
.tag.line{background:transparent;border:1px solid var(--border-2)}
.req{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.req .lbl{font-size:12px;color:var(--faint);margin-right:2px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sec-head .muted{font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.switch{width:34px;height:20px;border-radius:999px;background:var(--p);position:relative;flex:none}
.switch::after{content:"";position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.switch.off{background:var(--border-2)}.switch.off::after{right:auto;left:3px}
.switch.lock{background:var(--p);opacity:.55}
</style></head>
<body><div id="root"></div>
<script>
// ---------- icons (1.6px line set) ----------
const I={
 overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 library:'<path d="M4 5.5h6a2 2 0 0 1 2 2V20a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M20 5.5h-6a2 2 0 0 0-2 2V20a1.5 1.5 0 0 1 1.5-1.5H20z"/>',
 mine:'<path d="M6 3.5h12v17l-6-4-6 4z"/>',
 plug:'<path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 user:'<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.4 4-5 7-5s5.8 1.6 7 5"/>',
 eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/>',
 film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.5 6.5l2.5 2.5M15 15l2.5 2.5M6.5 17.5 9 15M15 9l2.5-2.5"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 lock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
 pin:'<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 cut:'<circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8.2 8.3 20 18M8.2 15.7 20 6"/>',
 export:'<path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
 bot:'<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4"/><circle cx="9" cy="13.5" r="1.2"/><circle cx="15" cy="13.5" r="1.2"/>',
 node:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11 15.7 7M8.3 13l7.4 4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
};
const ic=(n,s=18,w=1.6)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const mark=(s=28)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect width="100" height="100" rx="26" fill="#7B2CBF"/><rect x="20" y="31" width="44" height="13" rx="6.5" fill="#fff"/><rect x="36" y="56" width="44" height="13" rx="6.5" fill="#fff" opacity=".92"/><circle cx="71" cy="37.5" r="5.5" fill="#C8A2E8"/></svg>`;

// ---------- shell ----------
function shell(active,crumb,body){
  const nav=[['overview','Overview'],['library','Workflow Library'],['mine','My Workflows'],['plug','Integrations'],['settings','Settings']];
  return `<div class="app"><aside class="side">
    <div class="brand">${mark(30)}<b>Edit<span>Flo</span></b></div>
    ${nav.map(([k,l],i)=>`<div class="nav ${k===active?'on':''}">${ic(k)}${l}${k==='mine'?'<span class="count">2</span>':''}</div>`).join('')}
    <div class="foot"><b>Create more. Edit less.</b>Start publishing.</div>
  </aside>
  <main class="main"><div class="top"><div class="crumb">${crumb}</div>
    <span class="proto"><i></i>Conceptual prototype</span>
    <div class="avatar">${ic('user',17)}</div></div>
  <div class="content">${body}</div></main></div>`}

// ================= SCREEN 1 — DASHBOARD =================
function stageStrip(n=6,active=3){return `<div style="display:flex;align-items:center;gap:0">${Array.from({length:n},(_,i)=>`<div style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:650;${i<active?'background:var(--p);color:#fff':'background:#fff;border:1.5px solid var(--l);color:var(--p)'}">${i+1}</div>${i<n-1?`<div style="width:26px;height:1.5px;background:${i<active-1?'var(--p)':'var(--l)'}"></div>`:''}`).join('')}</div>`}
const reqTags=(arr)=>`<div class="req"><span class="lbl">Requires</span>${arr.map(a=>`<span class="tag line">${a}</span>`).join('')}</div>`;
function dashboard(){
  const hero=`<section style="display:grid;grid-template-columns:1fr 340px;gap:36px;align-items:end;margin-bottom:24px">
    <div>
      <div class="mono" style="color:var(--p);margin-bottom:12px">Overview</div>
      <h1 style="font-size:44px;line-height:1.04">Make your next edit easier.</h1>
      <p class="muted" style="font-size:16.5px;margin:10px 0 20px;max-width:600px">Discover reusable workflows that help you spend less time on repetitive editing tasks.</p>
      <div style="display:flex;gap:10px">
        <div style="flex:1;display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;background:#fff;border:1px solid var(--border-2);border-radius:var(--r);box-shadow:var(--sh)">
          <span style="color:var(--faint)">${ic('search',19)}</span><span style="color:var(--faint);font-size:15px">Search workflows, editing tasks or tools...</span>
          <span style="margin-left:auto" class="tag line">/</span></div>
        <div class="btn pri" style="height:52px;padding:0 20px">Explore workflows ${ic('arrow',17,1.8)}</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;align-items:center"><span style="font-size:12.5px;color:var(--faint)">Common tasks</span>
        ${['Organise raw footage','Remove pauses','Select highlights','Prepare vertical clips'].map(s=>`<span class="tag">${s}</span>`).join('')}</div>
    </div>
    <div class="card" style="padding:18px 20px 16px">
      <div class="mono" style="color:var(--mut);margin-bottom:12px">How EditFlo works</div>
      ${[['library','Choose a workflow','Start from a reusable editing process.'],['node','Connect your tools','Your AI assistant and editor, via MCP.'],['eye','Review and approve','Nothing is final until you say so.']].map(([i,t,d],k)=>`
        <div style="display:flex;gap:12px;${k?'margin-top:11px':''}"><div style="width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--p);display:grid;place-items:center;flex:none">${ic(i,17)}</div>
        <div><div style="font-weight:600">${t}</div><div class="muted" style="font-size:12.5px">${d}</div></div></div>`).join('')}
    </div></section>`;
  // featured bento
  const yt=`<div class="card" style="grid-row:span 2;padding:24px;display:flex;flex-direction:column">
      <div style="display:flex;gap:8px"><span class="tag p">Long-form</span><span class="tag">YouTube</span><span class="tag" style="margin-left:auto">6 stages</span></div>
      <h2 style="font-size:24px;letter-spacing:-.025em;margin:14px 0 6px;font-family:'Inter Display'">YouTube Long-form Workflow</h2>
      <p class="muted" style="margin:0 0 14px;font-size:14.5px;max-width:420px">Organise footage and structure a repeatable editing process for longer videos.</p>
      <div style="background:var(--tint-2);border:1px solid #EFE4F8;border-radius:var(--r);padding:14px 18px;margin-bottom:auto">
        <div class="mono" style="color:var(--mut);margin-bottom:12px">Stages</div>
        ${stageStrip(6,0)}
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin-top:14px;font-size:12.5px;color:var(--ink-2)">
          ${['Footage organisation','Review and selection','Editing preparation','AI-assisted execution','Creator review','Export preparation'].map((s,i)=>`<div><span style="color:var(--p);font-weight:600">0${i+1}</span> ${s}</div>`).join('')}</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">${reqTags(['OpenFilm','MCP','AI assistant'])}<span class="btn ghost">View workflow ${ic('arrow',15,1.8)}</span></div>
    </div>`;
  const small=(cat,name,desc,req,viz,wide)=>`<div class="card" style="padding:18px 20px;display:flex;flex-direction:column;height:100%">
      <div style="display:flex;align-items:flex-start;justify-content:space-between"><span class="tag p">${cat}</span>
        <div style="width:${wide?150:84}px;height:62px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;margin:-4px -6px 0 0"><div style="transform:scale(${wide?.56:.62})">${viz}</div></div></div>
      <h2 style="margin:6px 0 5px">${name}</h2><p class="muted" style="margin:0 0 12px;font-size:13px">${desc}</p>
      <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px">${reqTags(req)}<span class="btn ghost">View ${ic('arrow',15,1.8)}</span></div></div>`;
  const vVert=`<div style="display:flex;gap:6px;align-items:flex-end">${[0,1,2].map(i=>`<div style="width:26px;height:${[64,78,64][i]}px;border-radius:5px;background:${i==1?'var(--p)':'var(--l)'};opacity:${i==1?1:.7}"></div>`).join('')}</div>`;
  const vPod=`<div style="width:96px"><div style="display:flex;gap:2px;align-items:center;height:30px">${[8,16,24,12,20,28,10,18,26,14,22,9,17,25,11].map((h,i)=>`<div style="flex:1;height:${h}px;border-radius:2px;background:${i>=5&&i<=9?'var(--p)':'var(--faint)'};opacity:${i>=5&&i<=9?1:.5}"></div>`).join('')}</div><div style="display:flex;gap:4px;margin-top:9px;justify-content:center"><div style="width:22px;height:30px;border-radius:4px;background:var(--p)"></div><div style="width:22px;height:30px;border-radius:4px;background:var(--l)"></div><div style="width:22px;height:30px;border-radius:4px;background:var(--l);opacity:.6"></div></div></div>`;
  const vMod=`<div style="display:grid;grid-template-columns:repeat(3,22px);gap:5px">${[1,0,1,0,1,0,1,1,0].map((on,i)=>`<div style="height:22px;border-radius:5px;${on?'background:var(--p);opacity:'+(i%2?.55:1):'border:1.5px dashed var(--l)'}"></div>`).join('')}</div>`;
  const featured=`<section style="margin-bottom:24px"><div class="sec-head"><h2>Featured workflows</h2><span class="muted">Reusable editing processes you can start from</span></div>
    <div style="display:grid;grid-template-columns:1.12fr 1fr 1fr;grid-template-rows:auto auto;gap:16px">
      ${yt}
      ${small('Short-form','Short-form Content Workflow','A reusable process for preparing vertical content and social media clips.',['OpenFilm','AI assistant'],vVert)}
      ${small('Repurposing','Podcast Repurposing Workflow','Organise a process for turning longer recordings into shorter content.',['OpenFilm','MCP'],vPod)}
      <div style="grid-column:span 2">${small('General','Content Editing Workflow','A flexible starting point for managing repetitive editing operations. Adapt the stages to your own projects.',['OpenFilm','MCP','AI assistant'],vMod,true)}</div>
    </div></section>`;
  const mine=`<section><div class="sec-head"><h2>My workflows</h2><span class="muted">Illustrative examples</span></div>
    <div class="card" style="padding:4px 0">
    ${[['Weekly vlog edit','YouTube Long-form','Pacing: Tight · Keep intro hook','Ready to use','ok'],['Interview episode cut','Podcast Repurposing','Preserve guest answers','Draft','draft']].map(([n,b,p,s,k],i)=>`
      <div style="display:grid;grid-template-columns:28px 1.15fr 1.4fr 1.25fr .9fr 110px;align-items:center;gap:16px;padding:10px 20px;${i?'border-top:1px solid var(--border)':''}">
        <span style="color:var(--p)">${ic('mine',17)}</span><b style="font-weight:600">${n}</b>
        <span class="muted" style="font-size:13px">Based on ${b}</span><span class="muted" style="font-size:13px">${p}</span>
        <span style="display:flex;align-items:center;gap:7px;font-size:13px"><span class="dot" style="background:${k==='ok'?'var(--ok)':k==='warn'?'#D18A1E':'var(--faint)'}"></span>${s}</span>
        <span class="btn sec" style="height:32px;font-size:13px;justify-content:center">Open</span></div>`).join('')}
    </div></section>`;
  return shell('overview','<b>Overview</b>',hero+featured+mine);
}

// ================= SCREEN 2 — WORKFLOW DETAIL =================
function detail(){
  const stages=[
    ['01','Footage organisation','Group raw clips by scene and take, and name them consistently so the edit starts in order.',['OpenFilm'],'Folder structure and clip names','creator','folder'],
    ['02','Content review and selection','Mark the sections worth keeping. Optional AI-assisted notes can flag repeated takes and long pauses.',['AI assistant · optional'],'Which sections stay and which go','creator','eye'],
    ['03','Editing preparation','Set the sequence order and your editing preferences: pacing, moments to preserve, and style.',['EditFlo'],'Order and preferences before anything runs','creator','sliders'],
    ['04','AI-assisted execution','Your AI assistant follows the instructions via MCP: trims pauses, assembles a rough cut, applies your preferences.',['MCP','AI assistant','OpenFilm'],'A proposed rough cut, not a final edit','ai','spark'],
    ['05','Creator review and refinement','Compare the proposed cut with your selections. Accept, adjust or undo each change before moving on.',['OpenFilm'],'Every change made in stage 04','check','check'],
    ['06','Final export preparation','Confirm the format and export settings for YouTube, then hand off a publish-ready file.',['OpenFilm'],'Format and final approval','creator','export'],
  ];
  const kind={creator:['Creator-led','line'],ai:['AI-assisted','p'],check:['Checkpoint','p']};
  const list=stages.map(([n,t,d,tools,rev,k,icn],i)=>`
    <div style="display:grid;grid-template-columns:44px 1fr;gap:16px;position:relative">
      <div style="display:flex;flex-direction:column;align-items:center">
        <div style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center;${k==='ai'?'background:var(--p);color:#fff':k==='check'?'background:var(--tint);color:var(--p);border:1.5px solid var(--p)':'background:#fff;border:1px solid var(--border-2);color:var(--ink-2)'}">${ic(icn,18)}</div>
        ${i<5?`<div style="flex:1;width:1.5px;background:${i===3?'var(--p)':'var(--border-2)'};margin:4px 0"></div>`:''}
      </div>
      <div class="card" style="padding:9px 16px;margin-bottom:5px;${k==='ai'?'border-color:#E3D2F3;background:var(--tint-2)':''}">
        <div style="display:flex;align-items:center;gap:10px"><span class="mono" style="color:var(--p)">${n}</span><b style="font-size:15px;font-weight:620">${t}</b>
          <span class="tag ${kind[k][1]}" style="margin-left:auto">${kind[k][0]}</span></div>
        <p class="muted" style="margin:3px 0 8px;font-size:13px">${d}</p>
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div class="req">${tools.map(x=>`<span class="tag line">${x}</span>`).join('')}</div>
          <div style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)"><span style="color:var(--p)">${ic('eye',15)}</span><span style="color:var(--faint)">You review:</span> ${rev}</div>
        </div></div></div>`).join('');
  const head=`<section style="display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:18px">
    <div><div style="display:flex;gap:8px;margin-bottom:10px"><span class="tag p">Long-form</span><span class="tag">YouTube</span></div>
      <h1 style="font-size:34px;line-height:1.08">YouTube Long-form Workflow</h1>
      <p class="muted" style="font-size:15.5px;margin:8px 0 0;max-width:640px">A reusable editing process designed to organise the journey from raw footage to a publish-ready video.</p></div>
    <div style="display:flex;gap:10px"><span class="btn sec">${ic('sliders',16)} Customise workflow</span><span class="btn pri">Use this workflow ${ic('arrow',16,1.8)}</span></div></section>`;
  const meta=`<div style="display:flex;gap:28px;padding:11px 0 14px;border-top:1px solid var(--border);margin-bottom:6px;font-size:13px">
    ${[['list','6 stages'],['spark','1 AI-assisted stage'],['eye','You review every stage'],['film','Applied in OpenFilm']].map(([i,t])=>`<span style="display:flex;gap:8px;align-items:center;color:var(--ink-2)"><span style="color:var(--mut)">${ic(i,16)}</span>${t}</span>`).join('')}</div>`;
  const control=`<aside style="display:flex;flex-direction:column;gap:14px">
    <div class="card" style="padding:16px 20px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><span style="color:var(--p)">${ic('lock',18)}</span><h2>Creator control</h2></div>
      <p class="muted" style="font-size:12.5px;margin:0 0 14px">EditFlo prepares and assists. You decide what stays.</p>
      ${[['Review selected sections','Check what was kept before trimming starts.',''],['Preserve important content','Marked moments are never cut.',''],['Review before finalising','Required for every export.','lock']].map(([t,d,s],i)=>`
        <div style="display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border)"><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${t}</div><div class="muted" style="font-size:12.5px">${d}</div></div><div class="switch ${s}"></div></div>`).join('')}
      <div style="padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-weight:600;font-size:13.5px;margin-bottom:8px">Editing preferences</div>
        <div class="muted" style="font-size:12px;margin-bottom:6px">Pacing</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:8px;padding:3px;font-size:12.5px;text-align:center;font-weight:550">
          <span style="padding:6px;color:var(--mut)">Relaxed</span><span style="padding:6px;background:#fff;border-radius:6px;box-shadow:var(--sh);color:var(--p)">Balanced</span><span style="padding:6px;color:var(--mut)">Tight</span></div>
        <div class="muted" style="font-size:12px;margin:12px 0 6px">Always keep</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${['Intro hook','Key explanations','Call to action'].map(t=>`<span class="tag p">${ic('pin',13)} ${t}</span>`).join('')}<span class="tag line" style="color:var(--mut)">${ic('plus',13)} Add</span></div>
      </div></div>
    <div class="card" style="padding:14px 20px">
      <h2 style="font-size:14.5px;margin-bottom:4px">What you'll need</h2>
      ${[['film','OpenFilm','Where the workflow is applied'],['node','MCP connection','Links EditFlo to your tools'],['bot','An AI assistant that supports MCP','Runs stage 04 instructions']].map(([i,t,d])=>`
        <div style="display:flex;gap:10px;align-items:center;padding:4px 0"><span style="color:var(--mut)">${ic(i,17)}</span><div><div style="font-size:13px;font-weight:550">${t}</div><div class="muted" style="font-size:12px">${d}</div></div></div>`).join('')}
    </div></aside>`;
  return shell('library','Workflow Library <span style="color:var(--faint)">/</span> <b>YouTube Long-form Workflow</b>',
    head+meta+`<div style="display:grid;grid-template-columns:1fr 340px;gap:28px"><div>${list}</div>${control}</div>`);
}

// ================= SCREEN 3 — INTEGRATIONS & ECOSYSTEM =================
function integrations(){
  const nodes=[['EditFlo','Discover and organise reusable workflows.','library',true],['MCP integrations','Connect the workflow with supported tools and capabilities.','node',false],['AI assistants','Assist with executing workflow instructions.','bot',false],['OpenFilm','The editing environment where the workflow is applied.','film',false]];
  const W=1056,nw=226,gap=(W-nw*4)/3;
  const diagram=`<div class="card" style="padding:26px 30px 28px;margin-bottom:22px;position:relative">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px"><h2>How the ecosystem fits together</h2><span class="muted" style="font-size:13px">Proposed architecture</span></div>
    <div style="position:relative;height:262px">
      <!-- creator -->
      <div style="position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--border-2);background:#fff">
        <div style="width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--p);display:grid;place-items:center">${ic('user',17)}</div><b style="font-weight:600">You, the creator</b><span class="muted" style="font-size:12.5px">direct and approve</span></div>
      <svg style="position:absolute;inset:0;overflow:visible" width="${W}" height="290" viewBox="0 0 ${W} 290" fill="none">
        <path d="M${W/2-60} 38 C ${W/2-60} 70, ${nw/2} 60, ${nw/2} 104" stroke="var(--l)" stroke-width="1.6" stroke-dasharray="4 5"/>
        <path d="M${W/2+60} 38 C ${W/2+60} 70, ${W-nw/2} 60, ${W-nw/2} 104" stroke="var(--l)" stroke-width="1.6" stroke-dasharray="4 5"/>
        ${[0,1,2].map(i=>{const x1=nw*(i+1)+gap*i+8,x2=x1+gap-16;return `<path d="M${x1} 178 H${x2}" stroke="var(--p)" stroke-width="1.8"/><path d="M${x2-7} 172 l7 6 -7 6" stroke="var(--p)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`}).join('')}
      </svg>
      <div style="position:absolute;left:${nw/2-90}px;top:56px" class="mono"><span style="color:var(--mut);background:var(--surface);padding:0 6px">Chooses a workflow</span></div>
      <div style="position:absolute;left:${W-nw/2-80}px;top:56px" class="mono"><span style="color:var(--mut);background:var(--surface);padding:0 6px">Reviews the result</span></div>
      ${nodes.map(([t,d,i,hero],k)=>`<div style="position:absolute;left:${k*(nw+gap)}px;top:106px;width:${nw}px;height:150px;border-radius:12px;padding:18px;${hero?'background:var(--p);color:#fff':'background:var(--surface);border:1px solid var(--border-2)'}">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">${hero?`<div style="width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center">${mark(22)}</div>`:`<div style="width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--p);display:grid;place-items:center">${ic(i,17)}</div>`}<span class="mono" style="color:${hero?'#E7D7F5':'var(--faint)'}">0${k+1}</span></div>
        <div style="font-weight:650;font-size:16px;letter-spacing:-.01em">${t}</div>
        <div style="font-size:12.5px;line-height:1.45;margin-top:4px;color:${hero?'#EBDDF7':'var(--mut)'}">${d}</div></div>`).join('')}
    </div></div>`;
  const status={proto:['In prototype','var(--p)','solid'],explore:['Exploring','var(--l)','solid'],concept:['Concept','transparent','dashed']};
  const items=[
    ['library','EditFlo workflow library','Reusable workflow definitions you can browse, save and customise.','EditFlo','proto'],
    ['node','EditFlo MCP connection','Exposes a workflow’s instructions to tools that support the Model Context Protocol.','MCP','proto'],
    ['bot','MCP-compatible AI assistants','Assistants that can read MCP instructions, for example Claude or Codex. No official partnership.','AI assistants','explore'],
    ['film','OpenFilm','Applying workflow stages directly inside the OpenFilm editing environment.','Editing environment','concept'],
    ['cut','Other editing software','Support for additional editors through MCP, where they expose suitable capabilities.','Editing environment','concept'],
    ['folder','Footage sources','Bringing raw footage in from local folders and cloud storage.','Inputs','concept'],
  ];
  const legend=`<div style="display:flex;gap:18px;font-size:12.5px;color:var(--mut)">${Object.values(status).map(([l,c,b])=>`<span style="display:flex;align-items:center;gap:7px"><span class="dot" style="background:${c};${b==='dashed'?'border:1.5px dashed var(--faint);width:9px;height:9px':''}"></span>${l}</span>`).join('')}</div>`;
  const panel=`<section><div class="sec-head"><div style="display:flex;align-items:center;gap:14px"><h2>Integrations</h2></div>${legend}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
      ${items.map(([i,t,d,cat,s])=>{const [l,c,b]=status[s];return `<div class="card" style="padding:16px 18px;${s==='concept'?'border-style:dashed;box-shadow:none;background:transparent':''}">
        <div style="display:flex;align-items:center;gap:10px"><div style="width:34px;height:34px;border-radius:9px;background:${s==='concept'?'var(--sunk)':'var(--tint)'};color:${s==='concept'?'var(--mut)':'var(--p)'};display:grid;place-items:center">${ic(i,18)}</div>
          <div><div style="font-weight:620">${t}</div><div class="muted" style="font-size:12px">${cat}</div></div>
          <span style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap"><span class="dot" style="background:${c};${b==='dashed'?'border:1.5px dashed var(--faint);width:9px;height:9px':''}"></span>${l}</span></div>
        <p class="muted" style="font-size:12.5px;margin:10px 0 0">${d}</p></div>`}).join('')}
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--mut)">${ic('info',15)} Statuses describe EditFlo’s proposed roadmap. Product names identify compatible tools only; no official partnerships or integrations are implied.</div></section>`;
  const head=`<section style="margin-bottom:22px"><div class="mono" style="color:var(--p);margin-bottom:10px">Integrations</div>
    <h1 style="font-size:36px;line-height:1.08">Your workflow, connected to your tools.</h1>
    <p class="muted" style="font-size:15.5px;margin:8px 0 0;max-width:720px">EditFlo organises the workflow. MCP connects it to your tools, an AI assistant helps carry out the instructions, and the edit happens in OpenFilm, with you reviewing each step.</p></section>`;
  return shell('plug','<b>Integrations</b>',head+diagram+panel);
}
