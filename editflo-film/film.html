<!doctype html>
<html><head><meta charset="utf-8"><title>EditFlo Product Film</title>
<style>
:root{--p:#7B2CBF;--l:#C8A2E8;--bg:#F8F5F0;--ink:#1E1B22;--mut:#8C8692;--line:#E6E0D8}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink);background:var(--bg)}
.a{position:absolute}
.disp{font-family:'Inter Display',Inter,sans-serif;letter-spacing:-0.035em}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.card{background:#fff;border:1px solid #ECE6DF;border-radius:22px;box-shadow:0 1px 2px rgba(30,27,34,.04),0 18px 40px -18px rgba(60,30,90,.18)}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .1em;margin-bottom:-.1em}
.m>span{display:inline-block}
</style></head>
<body><div id="stage"></div>
<script src="data.js"></script>
<script>
// ---------- time + easing ----------
const C={p:'#7B2CBF',l:'#C8A2E8',bg:'#F8F5F0',ink:'#1E1B22',mut:'#8C8692',line:'#E6E0D8',ll:'#EFE4F8'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={expo:t=>t>=1?1:1-Math.pow(2,-10*t),out:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},lin:t=>t,in:t=>t*t*t};
const P=(t,t0,d,e=E.expo)=>e(cl((t-t0)/d));
const lerp=(a,b,x)=>a+(b-a)*x;
// source-time (original recording) -> output-time (edited film)
function T(s){for(const x of EDL){const [a,b]=x.src;if(s<a)return x.out;if(s<=b)return x.out+s-a}return CUES.dur}
const DUR=CUES.dur+4.2; window.DUR=DUR;

// ---------- primitives ----------
const st=o=>Object.entries(o).map(([k,v])=>k+':'+v).join(';');
function A(x,y,inner,extra=''){return `<div class="a" style="left:${x}px;top:${y}px;${extra}">${inner}</div>`}
// words rising out of a mask
function rise(txt,t,t0,{stag=.045,dur=.7,out=null}={}){
  return txt.split(' ').map((w,i)=>{let y=(1-P(t,t0+i*stag,dur))*112;
    if(out!=null)y-=P(t,out+i*.025,.45,E.io)*112;
    return `<span class="m"><span style="transform:translateY(${y}%)">${w}</span></span>`}).join(' ')}
// typewriter with caret
function typed(txt,t,t0,cps=26,caret=true){const n=Math.floor(cl((t-t0)*cps,0,txt.length));
  const done=(t-t0)*cps>=txt.length; const blink=done?(Math.floor((t-t0-txt.length/cps)*2.2)%2===0&&(t-t0-txt.length/cps)<1.2):true;
  const car=caret&&t>=t0&&blink?`<span style="display:inline-block;width:.07em;height:.95em;background:${C.p};vertical-align:-.12em;margin-left:.04em;border-radius:2px"></span>`:'';
  return txt.slice(0,n).replace(/ /g,'&nbsp;')+car}
// purple pill highlight that wipes in
function pill(txt,t,t0,{bg=C.p,fg='#fff',pad='.04em .22em .1em',rad='.18em'}={}){const p=P(t,t0,.55);
  return `<span style="display:inline-block;background:${bg};color:${fg};padding:${pad};border-radius:${rad};clip-path:inset(0 ${(1-p)*100}% 0 0 round ${rad})"><span style="display:inline-block;transform:translateX(${(1-P(t,t0+.08,.6))*-30}px);opacity:${P(t,t0+.08,.4)}">${txt}</span></span>`}
// standard two-line headline (typed line + pill), editorial, top-left
function head(t,t0,l1,l2,{x=140,y=150,size=66,t2=null,align='left'}={}){
  const d1=l1.length/30; const tp=t2??(t0+d1+.05);
  return A(x,y,`<div class="disp" style="font-size:${size}px;font-weight:600;line-height:1.08;text-align:${align}">
    <div>${typed(l1,t,t0,30,t<tp)}</div><div style="margin-top:.08em">${t>=tp?pill(l2,t,tp):''}</div></div>`,align==='center'?'transform:translateX(-50%)':'')}
function mono(txt,t,t0,{size=17,color=C.mut}={}){return `<span class="mono" style="font-size:${size}px;color:${color}">${typed(txt,t,t0,40,false)}</span>`}
// draw-on svg path (pathLength=1)
function dr(d,p,{w=3,c=C.p,dash=null,cap='round'}={}){return `<path d="${d}" pathLength="1" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap}" stroke-dasharray="${dash||'1 1'}" stroke-dashoffset="${dash?0:1-p}" ${dash?`opacity="${p}"`:''}/>`}
function svg(inner,w=1920,h=1080,x=0,y=0){return `<svg class="a" style="left:${x}px;top:${y}px;overflow:visible" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`}
function mark(s,{glow=0}={}){return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" style="display:block;overflow:visible">
  ${glow?`<rect x="-6" y="-6" width="112" height="112" rx="32" fill="${C.l}" opacity="${.35*glow}"/>`:''}
  <rect width="100" height="100" rx="27" fill="${C.p}"/>
  <rect x="20" y="31" width="44" height="13" rx="6.5" fill="#fff"/>
  <rect x="36" y="56" width="44" height="13" rx="6.5" fill="#fff" opacity=".92"/>
  <path d="M64 37.5 C 78 37.5, 78 62.5, 80 62.5" fill="none" stroke="${C.l}" stroke-width="4" stroke-linecap="round" opacity=".0"/>
  <circle cx="71" cy="37.5" r="5.5" fill="${C.l}"/></svg>`}
function wordmark(size,t=99,t0=0){return `<span class="disp" style="font-size:${size}px;font-weight:700;letter-spacing:-0.045em">${rise('Edit',t,t0)}<span style="color:${C.p};margin-left:-.07em">${rise('Flo',t,t0+.08)}</span></span>`}
const check=(p,s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 30 30"><circle cx="15" cy="15" r="${13*E.back(cl(p*1.4))}" fill="${C.p}"/>${p>.3?`<path d="M9 15.5l4 4 8-9" pathLength="1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="${1-cl((p-.3)/.6)}"/>`:''}</svg>`;
const tag=(txt,{bg='#fff',fg=C.ink,bd='#E8E1EE',size=26})=>`<span style="display:inline-block;background:${bg};color:${fg};border:1.5px solid ${bd};border-radius:999px;padding:.38em .9em;font-size:${size}px;font-weight:500;white-space:nowrap">${txt}</span>`;
function pop(t,t0,inner,{dy=26,s0=.92,dur=.7}={}){const p=P(t,t0,dur);const q=P(t,t0,dur*.6,E.out);if(t<t0)return '';return `<div style="opacity:${q};transform:translateY(${(1-p)*dy}px) scale(${lerp(s0,1,p)});transform-origin:50% 60%">${inner}</div>`}

// ---------- scenes (times given in SOURCE seconds, mapped via T) ----------
const S=[];const SFX=[];
function scene(a,b,f,{exit="up",chap=null,sfx=[]}={}){S.push({a:T(a),b:b>=999?1e9:T(b),f,exit,chap});sfx.forEach(([k,s,v])=>SFX.push({k,t:T(s),v:v??1}))}

// 1 — cold open: the hidden half of content
scene(0,12.3,(t)=>{let h='';const a=T(0),k=T(3.26);
  h+=t<k+.2?head(t,a+.15,'Think about your','favourite creator',{t2:T(1.64)}):'';
  if(t<k+.2)h=`<div style="opacity:${1-P(t,k,.3)};transform:translateY(${-30*P(t,k,.35,E.io)}px)">${h}</div>`;
  h+=t>=k?head(t,k,"What you don't see",'is the editing',{t2:T(8.1)}):'';
  // phone frame / creator card
  const pp=P(t,a+.35,1.0), mv=P(t,T(4.6),1.0,E.io);
  const px=lerp(1260,140,mv), py=lerp(250,560,mv), sc=lerp(1,.5,mv);
  const rec=Math.floor(t*1.6)%2===0;
  h+=A(px,py,`<div class="card" style="width:330px;height:560px;border-radius:34px;position:relative;overflow:hidden;opacity:${pp};transform:translateY(${(1-pp)*40}px) scale(${sc});transform-origin:0 0;background:linear-gradient(180deg,#fff, #F7F1FB)">
     <div class="a" style="left:115px;top:150px;width:100px;height:100px;border-radius:50%;background:${C.l}"></div>
     <div class="a" style="left:60px;top:268px;width:210px;height:150px;border-radius:105px 105px 22px 22px;background:${C.l};opacity:.75"></div>
     <div class="a mono" style="left:24px;top:24px;font-size:15px;color:${C.ink};display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:50%;background:${rec?'#E5484D':'#f0b7b9'};display:inline-block"></span>REC</div>
     <div class="a" style="left:24px;right:24px;bottom:26px;height:6px;border-radius:3px;background:#EEE6F3"><div style="width:${cl((t-a)/12)*100}%;height:100%;background:${C.p};border-radius:3px"></div></div>
   </div>`);
  // timeline tracks
  const r0=T(5.62),e0=T(8.34);
  const rw=380*P(t,r0,1.2,E.out), ew=700*P(t,e0,2.6,E.out);
  if(t>=r0-.1){
    h+=A(500,470,mono('Recording',t,r0-.1));h+=A(500,505,`<div style="width:${rw}px;height:64px;border-radius:14px;background:${C.p}"></div>`);
  }
  if(t>=e0-.1){
    h+=A(500,610,mono('Editing',t,e0-.1));
    h+=A(500,645,`<div style="display:flex;gap:6px;width:${ew}px;overflow:hidden">${Array.from({length:12},(_,i)=>`<div style="flex:0 0 ${[70,40,90,55,30,80,60,45,85,50,65,40][i]}px;height:64px;border-radius:12px;background:${i%3==1?'#E9DDF4':C.l}"></div>`).join('')}</div>`);
    const tw=T(9.34);
    if(t>=tw)h+=A(1290,520,`<div class="disp" style="font-size:230px;font-weight:700;color:${C.p};line-height:1;opacity:${P(t,tw,.5)};transform:translateY(${(1-P(t,tw,.8))*60}px)">≈2×</div>`);
  }
  return h},{chap:null,sfx:[['tick',3.26,.5],['swish',4.6,.5],['tick',5.62],['tick',8.34],['thud',9.34,.7]]});

// 2 — name reveal
scene(12.3,24.5,(t)=>{let h='';const a=T(12.46),n=T(13.84),ty=T(15.34),ai=T(16.88),bc=T(20.3);
  // line that the bars collapse into
  const lp=P(t,a-.1,.9,E.io);
  const up=P(t,ai,.9,E.io), gone=P(t,bc-.15,.5,E.io);
  const wy=lerp(430,330,up)-gone*80, wo=1-gone;
  h+=svg(dr(`M${960-420*lp} 640 L${960+420*lp} 640`,1,{w:3,c:C.l}),1920,1080);
  if(t<n+.05)h=`<div style="opacity:${1-P(t,n-.2,.3)}">${h}</div>`;
  if(t>=n-.15){
    const mp=P(t,n-.15,.8,E.back);
    h+=A(960,wy,`<div style="display:flex;align-items:center;gap:40px;transform:translateX(-50%) scale(${lerp(1,.78,up)});opacity:${wo};transform-origin:50% 50%">
      <div style="transform:scale(${mp}) rotate(${(1-mp)*-30}deg)">${mark(170)}</div>
      <div style="position:relative">${wordmark(200,t,n)}${t>=ty?`<span class="disp" style="position:absolute;left:100%;top:0;font-size:200px;font-weight:700;letter-spacing:-0.045em;color:${C.l};opacity:${P(t,ty,.3)*(1-P(t,T(16.56),.4))}">w</span>
         <div class="a" style="left:calc(100% + 4px);top:118px;width:${130*P(t,T(16.08),.35,E.io)}px;height:10px;border-radius:5px;background:${C.p};opacity:${1-P(t,T(16.56),.4)}"></div>
         <div class="a" style="left:100%;top:-40px;opacity:${P(t,ty,.3)*(1-P(t,T(16.56),.4))}">${tag('not a typo',{bg:C.ink,fg:'#fff',bd:C.ink,size:22})}</div>`:''}</div></div>`);
  }
  if(t>=ai){ const tags=[['AI-assisted',T(17.06)],['Editing workflow',T(17.84)],['For busy creators',T(19.6)]];
    h+=A(960,wy+300,`<div style="display:flex;gap:16px;transform:translateX(-50%);opacity:${wo}">${tags.map(([s,tt])=>pop(t,tt,tag(s,{size:28,bd:'#E3D5EF'}),{dy:20})).join('')}</div>`);
  }
  if(t>=bc){ const d=T(20.64);
    h+=A(140,330,`<div class="disp" style="font-size:118px;font-weight:600;line-height:1.02">${rise('Your ideas deserve',t,d)}<br>${rise('more time than your',t,T(21.36))}<br><span style="color:${C.p}">${rise('timeline.',t,T(22.2))}</span></div>`);
    const tp=P(t,T(22.2),1.4,E.out);
    h+=svg(`<line x1="760" y1="${788}" x2="${760+1020*tp}" y2="788" stroke="${C.line}" stroke-width="3"/>`+
      [0,1,2,3,4,5,6].map(i=>{const x=760+i*150-((t-T(22.2))*90)%150;const o=P(t,T(22.2)+i*.06,.5);return x<760||x>1760?'':`<rect x="${x}" y="760" width="${[110,70,130,90,60,120,80][i]}" height="56" rx="10" fill="${i%2?C.l:C.p}" opacity="${o*(i%2?.9:.85)}"/>`}).join('')+
      (t>=T(22.2)?`<line x1="${760+520*tp}" y1="740" x2="${760+520*tp}" y2="836" stroke="${C.ink}" stroke-width="3"/>`:''));
  }
  return h},{sfx:[['swish',12.46,.5],['chime',13.84],['tick',15.34,.6],['tick',16.08,.6],['pop',17.06,.5],['pop',17.84,.5],['pop',19.6,.5],['swish',20.4,.5]]});

// 3 — only half the work → mountain → the three tasks
scene(24.5,37.7,(t)=>{let h='';const a=T(24.62);
  const swapT=T(31.84);
  h+=t<swapT+.2?`<div style="opacity:${1-P(t,swapT-.1,.3)}">${head(t,a+.1,'Creating content is','only half the work',{t2:T(26.56)})}</div>`:'';
  h+=t>=swapT-.1?head(t,swapT-.1,'A mountain of','repetitive tasks',{t2:T(32.5)}):'';
  // half circle
  const cx=1370,cy=560,R=250, hp=P(t,T(26.56),1.0,E.io), shrink=P(t,T(29.46),1.0,E.io), goneC=P(t,swapT-.3,.6,E.io);
  const camOff=t>=T(28.72);
  if(goneC<1){
  h+=`<div style="opacity:${(1-goneC)*P(t,a,.6)};transform:translate(${-shrink*360}px,${-shrink*40}px) scale(${lerp(1,.62,shrink)});transform-origin:${cx}px ${cy}px" class="a">`+svg(
    `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.line}" stroke-width="3"/>
     <path d="M${cx} ${cy-R} A${R} ${R} 0 0 0 ${cx} ${cy+R} Z" fill="${C.p}" opacity="${P(t,a+.2,.7)}"/>
     ${dr(`M${cx} ${cy-R} A${R} ${R} 0 0 1 ${cx} ${cy+R}`,hp,{w:4,c:C.ink})}
     <text x="${cx-125}" y="${cy+8}" text-anchor="middle" font-family="JetBrains Mono" font-size="22" fill="#fff" letter-spacing="2" opacity="${P(t,a+.4,.5)}">CREATE</text>
     <text x="${cx+125}" y="${cy+8}" text-anchor="middle" font-family="JetBrains Mono" font-size="22" fill="${C.ink}" letter-spacing="2" opacity="${hp}">EDIT</text>
     <g opacity="${P(t,a+.5,.4)}"><rect x="${cx-70}" y="${cy-R-70}" width="140" height="44" rx="22" fill="#fff" stroke="#E6DDEB"/><circle cx="${cx-38}" cy="${cy-R-48}" r="8" fill="${camOff?'#C9C3CF':'#E5484D'}"/><text x="${cx+8}" y="${cy-R-41}" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="${C.ink}" letter-spacing="2">${camOff?'OFF':'REC'}</text></g>`)+`</div>`;
  }
  // mountain of task cards
  const mt=T(29.92);
  if(t>=mt&&t<swapT+.8){const ord=[[0,0],[1,0],[2,0],[3,0],[0.5,1],[1.5,1],[2.5,1],[1,2],[2,2],[1.5,3]];
    h+=ord.map(([c,r],i)=>{const tt=mt+i*.09;const p=P(t,tt,.6,E.back);const g=P(t,swapT-.2+i*.02,.5,E.io);
      return t<tt?'':A(1150+c*150,760-r*92,`<div class="card" style="width:138px;height:80px;border-radius:14px;padding:16px;box-sizing:border-box;opacity:${p*(1-g)};transform:translateY(${(1-p)*-80+g*60}px) rotate(${(i%3-1)*3}deg)"><div style="height:8px;width:70%;background:#EFE8F4;border-radius:4px"></div><div style="height:8px;width:45%;background:#EFE8F4;border-radius:4px;margin-top:10px"></div></div>`)}).join('');
  }
  // the three tasks
  const tasks=[[T(31.84),'Reviewing raw footage','01'],[T(33.16),'Hunting for the right clips','02'],[T(34.18),'Cutting out dead space','03']];
  tasks.forEach(([tt,lab,num],i)=>{ if(t<tt)return; const x=140+i*560,y=430; const lt=t-tt;
    let viz='';
    if(i==0){ // film strip + scrubbing playhead
      const ph=(lt*120)%420;
      viz=`<div style="position:relative;height:150px;display:flex;gap:8px">${[0,1,2,3,4].map(j=>`<div style="flex:1;border-radius:10px;background:${j%2?'#EDE3F6':'#E3D3F1'}"></div>`).join('')}<div class="a" style="left:${ph}px;top:-10px;width:3px;height:170px;background:${C.p}"></div><div class="a" style="left:${ph-7}px;top:-18px;width:17px;height:17px;border-radius:50%;background:${C.p}"></div></div>`;
    } else if(i==1){ const sel=Math.floor(lt*2.4)%6;
      viz=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:150px">${[0,1,2,3,4,5].map(j=>`<div style="border-radius:10px;background:${j==sel?C.l:'#F1ECF5'};outline:${j==sel?`3px solid ${C.p}`:'none'};outline-offset:2px"></div>`).join('')}</div>`;
    } else { const k=P(t,tt+.9,.9,E.io); const bars=[30,60,45,80,20,0,0,0,55,70,40,0,0,65,35,75,50,0,0,0,60,30];
      let xx=0; viz=`<div style="position:relative;height:150px">`+bars.map((b,j)=>{const gap=b===0; const w=gap?lerp(14,0,k):14; const el=`<div class="a" style="left:${xx}px;top:${75-(b||8)/2}px;width:${Math.max(0,w-5)}px;height:${b||8}px;border-radius:4px;background:${gap?'#E5484D33':C.p};opacity:${gap?1-k:1}"></div>`; xx+=w+(gap?0:0); return el}).join('')+`</div>`;
    }
    h+=A(x,y,pop(t,tt,`<div class="card" style="width:520px;height:330px;padding:34px;box-sizing:border-box"><div class="mono" style="font-size:16px;color:${C.p}">${num}</div><div style="font-size:32px;font-weight:600;margin:8px 0 30px;letter-spacing:-0.01em">${lab}</div>${viz}</div>`,{dy:50}));
  });
  return h},{chap:'01 — The problem',sfx:[['swish',24.62,.4],['tick',26.56,.6],['tick',28.72,.7],['swish',29.92,.45],['pop',31.84,.6],['pop',33.16,.6],['pop',34.18,.6]]});

// 4 — a second job (quiet, give it room)
scene(37.7,41.95,(t)=>{let h='';const a=T(37.82);
  const lp=P(t,a,1.1,E.io);
  const steps=[0,1,2,3,4];
  const fade=P(t,T(39.82),.5,E.io);
  h+=`<div style="opacity:${1-fade}">`+svg(dr(`M260 540 L${260+1400*lp} 540`,1,{w:3,c:C.line})+steps.map(i=>{const p=P(t,a+.15+i*.15,.5,E.back);return `<circle cx="${260+i*350}" cy="540" r="${16*p}" fill="${i==2?C.p:'#fff'}" stroke="${i==2?C.p:C.ink}" stroke-width="3"/>`}).join(''))+
     A(960,590,`<div class="mono" style="transform:translateX(-50%);font-size:18px;color:${C.p};opacity:${P(t,T(38.92),.4)}">just a step?</div>`)+`</div>`;
  if(t>=T(39.82)){
    h+=A(960,330,`<div style="transform:translateX(-50%);text-align:center"><div class="disp" style="font-size:54px;font-weight:500;color:${C.mut}">${rise('It becomes an exhausting',t,T(39.82))}</div>
      <div class="disp" style="font-size:250px;font-weight:700;line-height:1;margin-top:10px;white-space:nowrap">${rise('second',t,T(40.84))} <span style="color:${C.p}">${rise('job.',t,T(41.28))}</span></div></div>`);
  }
  return h},{exit:'scale',sfx:[['swish',37.82,.35],['thud',40.84,.8]]});

// 5 — research: knowledge vs time
scene(57.3,72.4,(t)=>{let h='';const a=T(57.44);
  const k1=T(60.88);
  h+=t<k1+.3?`<div style="opacity:${1-P(t,k1,.35)}">${head(t,a,'I spoke directly','with creators',{t2:T(59.1)})}</div>`:'';
  // conversation bubbles
